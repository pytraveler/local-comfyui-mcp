# Publish a release when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
# 

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write          

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: The tag and pyproject must agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "tag $GITHUB_REF_NAME -> $tagged, pyproject says $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$tagged" >> "$GITHUB_ENV"

      - name: Release notes out of the changelogs
        run: |
          section() {
            awk -v v="$VERSION" '$1 == "##" && $2 == v {f=1; next} f && $1 == "##" {exit} f {print}' "$1"
          }
          section CHANGELOG.md > /tmp/en.md
          section CHANGELOG.ru.md > /tmp/ru.md
          if [ ! -s /tmp/en.md ] || [ ! -s /tmp/ru.md ]; then
            echo "::error::no section for $VERSION in CHANGELOG.md or CHANGELOG.ru.md"
            exit 1
          fi
          { cat /tmp/en.md; echo; echo "---"; echo; cat /tmp/ru.md; } > /tmp/notes.md
          cat /tmp/notes.md

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the environment
        run: uv sync

      - name: Run the suite
        run: uv run python -m pytest -q -rs

      - name: Pack the archive
        run: |
          name="comfyui-mcp-$VERSION"
          mkdir -p dist
          git archive --worktree-attributes --format=zip \
            --prefix="$name/" -o "dist/$name.zip" "$GITHUB_REF_NAME"
          unzip -l "dist/$name.zip" | tail -1
          echo "ARCHIVE=dist/$name.zip" >> "$GITHUB_ENV"
          echo "PREFIX=$name" >> "$GITHUB_ENV"

      - name: Nothing in it that should not be
        run: |
          listed=$(unzip -Z1 "$ARCHIVE")
          for bad in "src/mcp_bridge\.js" "minify_bridge\." "make_release\.py" \
                     "README_dev\.md" "CLAUDE\.md" "/\.mcp\.json" "kilo\.jsonc" \
                     "opencode\.jsonc" "/\.env$"; do
            if echo "$listed" | grep -qE -- "$bad"; then
              echo "::error::$ARCHIVE contains something matching $bad"
              exit 1
            fi
          done
          for needed in comfy_node/comfyui_mcp_bridge/web/mcp_bridge.js \
                        CHANGELOG.md CHANGELOG.ru.md README.md README.ru.md LICENSE; do
            echo "$listed" | grep -qxF -- "$PREFIX/$needed" || {
              echo "::error::$needed is missing from $ARCHIVE"
              exit 1
            }
          done
          echo "checked: the build and the documents are in, the sources and the private files are not"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
            --title "comfyui-mcp $VERSION" \
            --notes-file /tmp/notes.md \
            --verify-tag
