[project]
name = "comfyui-mcp"
version = "0.1.4"
description = "MCP server that drives ComfyUI through API-format workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "pytraveler", email = "travelerpy99@gmail.com" }]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27",
    "websockets>=14.0",
    "pillow>=10.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
comfyui-mcp = "comfyui_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
